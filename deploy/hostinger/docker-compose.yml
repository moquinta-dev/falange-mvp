name: falange-mvp

services:
  api:
    image: ${FALANGE_IMAGE:?FALANGE_IMAGE is required}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: sqlite:////data/falange.db
    expose:
      - "8000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.falange-api.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)
      - traefik.http.routers.falange-api.entrypoints=websecure
      - traefik.http.routers.falange-api.tls.certresolver=letsencrypt
      - traefik.http.routers.falange-api.service=falange-api
      - traefik.http.services.falange-api.loadbalancer.server.port=8000
    volumes:
      - ./data:/data
    networks:
      - traefik-proxy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  traefik-proxy:
    external: true

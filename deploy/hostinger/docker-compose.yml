name: falange-mvp

services:
  api:
    image: ${FALANGE_IMAGE:?FALANGE_IMAGE is required}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # PostgreSQL na rede privada falange-internal (repositório falange-mvp-infra).
      # O host falange-postgres só é resolvível dentro dessa rede.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-falange}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@falange-postgres:5432/${POSTGRES_DB:-falange}
      GRAFANA_DB_ROLE: ${GRAFANA_DB_ROLE:-grafana_ro}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:?WHATSAPP_VERIFY_TOKEN is required}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:?WHATSAPP_ACCESS_TOKEN is required}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:?WHATSAPP_PHONE_NUMBER_ID is required}
      META_APP_SECRET: ${META_APP_SECRET:?META_APP_SECRET is required}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v23.0}
      META_VALIDATE_SIGNATURE: ${META_VALIDATE_SIGNATURE:-false}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
    expose:
      - "8000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.falange-api.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)
      - traefik.http.routers.falange-api.entrypoints=websecure
      - traefik.http.routers.falange-api.tls.certresolver=letsencrypt
      - traefik.http.routers.falange-api.service=falange-api
      - traefik.http.services.falange-api.loadbalancer.server.port=8000
      # Basic Auth nos paths de documentação OpenAPI (defesa em profundidade).
      - traefik.http.middlewares.falange-docs-auth.basicauth.users=${TRAEFIK_DOCS_BASIC_AUTH_USERS:?TRAEFIK_DOCS_BASIC_AUTH_USERS is required}
      - traefik.http.routers.falange-api-docs.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`) && (PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`))
      - traefik.http.routers.falange-api-docs.entrypoints=websecure
      - traefik.http.routers.falange-api-docs.tls.certresolver=letsencrypt
      - traefik.http.routers.falange-api-docs.middlewares=falange-docs-auth
      - traefik.http.routers.falange-api-docs.service=falange-api
      - traefik.http.routers.falange-api-docs.priority=100
    networks:
      - traefik-proxy
      - falange-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  traefik-proxy:
    external: true
  # Rede privada compartilhada com a stack de dados (falange-mvp-infra).
  # Dá acesso ao PostgreSQL (falange-postgres) sem exposição na internet.
  falange-internal:
    external: true

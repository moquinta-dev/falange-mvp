[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falange-mvp"
version = "0.5.1"
description = "Falange MVP backend foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.111,<0.116",
  "httpx>=0.27,<0.28",
  "pydantic-settings>=2.3,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
